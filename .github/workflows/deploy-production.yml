name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

# Prevent concurrent deployments from conflicting
concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Remote VPS Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          envs: PROD_PORT,APP_PORT,WEB_PORT
          script: |
            set -e

            echo "================================================"
            echo "🚀 Starting Athiran CRM Automated Deployment: $(date)"
            echo "================================================"

            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH || '/var/www/athiran-crm' }}"
            APP_PORT="${{ secrets.APP_PORT || '5013' }}"
            WEB_PORT="${{ secrets.WEB_PORT || '98' }}"
            MONGO_PORT="${{ secrets.MONGODB_PORT || '27029' }}"
            SSH_PORT="${{ secrets.PROD_PORT || '22' }}"

            echo "📍 Deploy Destination: $DEPLOY_PATH"
            echo "🔌 Configured Backend Port: $APP_PORT"
            echo "🌐 Configured Frontend Port: $WEB_PORT"
            echo "🍃 Configured Internal MongoDB Port: $MONGO_PORT"

            # 1. Clone repository if first time, or pull latest code
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📂 Initializing fresh repository clone..."
              mkdir -p "$DEPLOY_PATH"
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            echo "📥 Fetching latest commits from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 2. Ensure environment configuration exists
            if [ ! -f backend/.env ]; then
              if [ -f backend/.env.example ]; then
                echo "⚠️ backend/.env not found. Initializing from backend/.env.example..."
                cp backend/.env.example backend/.env
              fi
            fi

            # 3A. OPTION A: If using Docker Compose
            if command -v docker >/dev/null 2>&1 && [ -f docker-compose.yml ]; then
              echo "🐳 Rebuilding and starting Docker containers..."
              docker compose pull --ignore-pull-failures || true
              docker compose up -d --build --remove-orphans
              docker image prune -f

            # 3B. OPTION B: Standard VPS with Node.js + PM2 + Nginx
            else
              echo "📦 Installing production dependencies..."
              npm ci
              npm ci --prefix backend --omit=dev
              npm ci --prefix frontend

              echo "🏗️ Building frontend client bundle..."
              npm run build --prefix frontend

              echo "🔄 Reloading backend service via PM2..."
              if command -v pm2 >/dev/null 2>&1; then
                PORT=$APP_PORT pm2 reload ecosystem.config.cjs --update-env || PORT=$APP_PORT pm2 start ecosystem.config.cjs
                pm2 save
              else
                echo "⚠️ PM2 not found globally. Falling back to direct node server..."
                pkill -f "src/server.js" || true
                PORT=$APP_PORT nohup node backend/src/server.js > backend/logs/server.log 2>&1 &
              fi
            fi

            # 4. Automated Health Check against configured API port
            echo "🩺 Running health check on port $APP_PORT..."
            sleep 5
            curl --fail --retry 5 --retry-delay 3 "http://127.0.0.1:${APP_PORT}/api/v1/health" || echo "⚠️ Warning: Health check endpoint did not respond immediately. Please verify logs."

            echo "================================================"
            echo "✅ Athiran Motors CRM deployment finished successfully!"
            echo "================================================"

