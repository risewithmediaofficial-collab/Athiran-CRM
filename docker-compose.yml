services:
  mongodb:
    image: mongo:7-jammy
    container_name: athiran-crm-mongodb
    restart: unless-stopped
    ports:
      # Bound strictly to internal loopback 127.0.0.1:27029 for database security
      - "127.0.0.1:27029:27017"
    environment:
      MONGO_INITDB_DATABASE: athiran_crm
    volumes:
      - mongodb_data:/data/db
    networks:
      - athiran-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: athiran-crm-backend
    restart: unless-stopped
    ports:
      - "5013:5013"
    environment:
      NODE_ENV: production
      PORT: 5013
      API_VERSION: v1
      MONGODB_URI: mongodb://mongodb:27017/athiran_crm
      FRONTEND_URL: http://localhost:98
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-athiran_motors_production_jwt_access_secret_min_64_characters_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-athiran_motors_production_jwt_refresh_secret_min_64_characters_key_2026}
      COOKIE_SECURE: "false"
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5013/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - athiran-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: athiran-crm-frontend
    restart: unless-stopped
    ports:
      - "98:80"
    depends_on:
      - backend
    networks:
      - athiran-net

volumes:
  mongodb_data:
  backend_uploads:

networks:
  athiran-net:
    driver: bridge

