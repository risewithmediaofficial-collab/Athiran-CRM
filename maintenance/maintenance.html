<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="8">
  <title>Under Maintenance — Athiran Motors CRM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      border-radius: 9999px;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #f59e0b;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: spin 12s linear infinite;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .progress-bar-container {
      background: rgba(51, 65, 85, 0.5);
      border-radius: 9999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      width: 100%;
      animation: indeterminate 2s infinite ease-in-out;
      transform-origin: 0% 50%;
    }
    .status-text {
      font-size: 0.8125rem;
      color: #64748b;
    }
    .footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      font-size: 0.75rem;
      color: #64748b;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%) scaleX(0.2); }
      50% { transform: translateX(0%) scaleX(0.6); }
      100% { transform: translateX(100%) scaleX(0.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      System Upgrade in Progress
    </div>
    
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>

    <h1>Athiran Motors CRM</h1>
    <p>We are applying an automated update to ensure maximum speed and stability. Zero downtime deployment is actively synchronizing services.</p>

    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>

    <div class="status-text">
      This page refreshes automatically. Stand by...
    </div>

    <div class="footer">
      Athiran Motors &bull; Dealer CRM &bull; Hostinger VPS Deployment
    </div>
  </div>
</body>
</html>
